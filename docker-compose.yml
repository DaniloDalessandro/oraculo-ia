services:
  redis:
    image: redis:7-alpine
    container_name: oraculo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: oraculo-postgres
    environment:
      POSTGRES_DB: oraculo
      POSTGRES_USER: oraculo
      POSTGRES_PASSWORD: oraculo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oraculo -d oraculo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
    container_name: oraculo-backend
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002
      DB_ENGINE: postgresql
      DB_NAME: oraculo
      DB_USER: oraculo
      DB_PASSWORD: oraculo
      DB_HOST: postgres
      DB_PORT: "5432"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: deepseek-v4-flash
      DEEPSEEK_TEMPERATURE: "0.1"
      REDIS_URL: redis://oraculo-redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./front
    container_name: oraculo-frontend
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
